[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun" # OZ 5.7 usa `mcopy` (opcode Cancun); Avalanche Subnet-EVM suporta. (paris não compila OZ 5.7)
auto_detect_solc = false

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Coverage: exui estado; inclui todos os contratos src.
[profile.default.fuzz]
runs = 256

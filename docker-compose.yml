# ═══════════════════════════════════════════════════════════════
# docker-compose.yml — revoa
# Plataforma DeFi de troca de produtos e serviços (token RVM, self-custody)
# ═══════════════════════════════════════════════════════════════
#
# Contrato de deploy: segue o protocolo da infra central `rodne/infra` (C:\Users\rodne\infra).
#   - NENHUMA porta exposta no host (TUDO via Traefik)
#   - NENHUM docker socket montado
#   - Redes: `internal` (bridge isolada) + `traefik_net` (external)
#   - Públicos (app/frontend/minio) na traefik_net; demais SÓ na interna
#
# Roteamento revoa.me: routers Traefik gerados do `.env` da infra central
#   (scripts/render.py) → http://revoa-app:8000
# O container `app` DEVE se chamar `revoa-app` e escutar em 0.0.0.0:8000.
# No cutover (Fase 4) o container Python do trocadeira é removido e o
# `revoa-app` (.NET) assume revoa.me automaticamente (mesmo nome + porta).
#
# PROFILES: serviços ainda sem Dockerfile/imagem pronta ficam sob `profiles`
# e só sobem com `docker compose --profile <nome> up -d`. Assim este arquivo é
# o contrato-vivo da topologia completa, enquanto mongo/minio já rodam hoje.
#   app, frontend            → profile:app        (Fase 1+)
#   mongo-dev, app-dev       → profile:dev        (dev.revoa.me)
#   anvil, avalanche, bundler,
#   paymaster, ollama        → profile:chain      (Fase 1)
#   mongo, minio, mail       → base (sem profile; sempre no projeto)
# ═══════════════════════════════════════════════════════════════

services:

  # ═══════════════════════════════════════════════════════════
  # APP — ASP.NET único (API + SignalR hub + SPA estática)
  # Em prod serve frontend + /api + /health. Escuta 0.0.0.0:8000.
  # ═══════════════════════════════════════════════════════════
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/Revoa.Api/Dockerfile
    container_name: revoa-app          # NÃO mudar: routers-revoa.yml aponta aqui
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:8000
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true   # confia em X-Forwarded-* (Traefik)
      - Mongo__ConnectionString=mongodb://mongo:27017/?replicaSet=rs0
      - Mongo__Database=revoa
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ROOT_USER:-revoa}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obrigatório (defina em .env)}
      # Chain: env-driven (Production não tem seção Chain no appsettings). Defaults = anvil
      # local (profile chain) com os endereços determinísticos do Deploy.s.sol (account[0]).
      # A chave real (CHAIN_FAUCET_KEY) vem do .env — nunca versionada.
      - Chain__RpcUrl=${CHAIN_RPC_URL:-http://anvil:8545}
      - Chain__ChainId=${CHAIN_CHAIN_ID:-31337}
      - Chain__FaucetPrivateKey=${CHAIN_FAUCET_KEY:-}
      - Chain__FundWalletGasOnCreate=true
      - Chain__FundWalletGasEther=1.0
      - Chain__Contracts__RVM=0x5FbDB2315678afecb367f032d93F642f64180aa3
      - Chain__Contracts__Treasury=0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
      - Chain__Contracts__ProductNFT=0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0
      - Chain__Contracts__ServiceVoucher=0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9
      - Chain__Contracts__EscrowVault=0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9
      - Chain__Contracts__CouponRedeemer=0x5FC8d32690cc91D4c39d9d3abcBD16989F875707
      - Admin__Emails=${ADMIN_EMAILS:-}  # Policy "Admin" (claim email); vazio = nega tudo
      - Ollama__Endpoint=http://ollama:11434
      - Bundler__Rpc=http://bundler:4337
      - Paymaster__Rpc=http://paymaster:3000
      # E-mail (ADR-0014): default = Postfix interno. P/ ENTREGA real, relay autenticado
      # no .env (EMAIL_RELAY_HOST=smtp.gmail.com etc. + App Password) — IP residencial
      # não entrega direto nos grandes MX.
      - Email__Host=${EMAIL_RELAY_HOST:-mail}
      - Email__Port=${EMAIL_RELAY_PORT:-25}
      - Email__From=${EMAIL_RELAY_FROM:-no-reply@revoa.me}
      - Email__Username=${EMAIL_RELAY_USERNAME:-}
      - Email__Password=${EMAIL_RELAY_PASSWORD:-}
      - Email__ApiKey=${BREVO_API_KEY:-} # setada = API REST do Brevo (chave v3 não autentica SMTP)
      - Zenvia__Token=${ZENVIA_TOKEN:-} # WhatsApp/SMS OTP (anti-farming via secrets)
      - Jwt__Key=${JWT_KEY:-}           # chave de assinatura JWT (fail-fast em Production se vazio)
      - Jwt__Audience=revoa
    depends_on:
      mongo: { condition: service_healthy }
      minio: { condition: service_healthy }
      mail: { condition: service_started }
    volumes:
      - revoa-app-data:/app/data
    networks: [internal, traefik_net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ═══════════════════════════════════════════════════════════
  # FRONTEND — dev server (Vite). Em prod a SPA é servida pelo app.
  # Profile separado para hot-reload durante o desenvolvimento.
  # ═══════════════════════════════════════════════════════════
  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: revoa-frontend
    environment:
      - VITE_API_URL=/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks: [internal, traefik_net]
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # MONGODB — replica set rs0 (otimistic locking + ACID seletiva)
  # SÓ na rede interna. Nunca no traefik_net.
  # ═══════════════════════════════════════════════════════════
  mongo:
    image: mongo:7
    container_name: revoa-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - revoa-mongo-data:/data/db
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.hello().isWritablePrimary === true ? quit(0) : quit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ═══════════════════════════════════════════════════════════
  # MINIO — S3-compatible (metadata/imagens NFT). tokenURI aponta p/ cá.
  # Acessível via Traefik em assets.revoa.me (labels) + interno p/ app.
  # ═══════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: revoa-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-revoa}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obrigatório (defina em .env)}
    volumes:
      - revoa-minio-data:/data
    networks: [internal, traefik_net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      # Console MinIO — acesso admin (proteger/limitar depois)
      - "traefik.http.routers.revoa-minio.rule=Host(`assets.revoa.me`)"
      - "traefik.http.routers.revoa-minio.entrypoints=web"
      - "traefik.http.routers.revoa-minio.middlewares=security-headers@file,gzip@file"
      - "traefik.http.services.revoa-minio.loadbalancer.server.port=9000"

  # ═══════════════════════════════════════════════════════════
  # MAIL — MTA leve auto-hospedado (Postfix + OpenDKIM)
  # E-mail transacional do domínio revoa.me (verificação de cadastro,
  # notificações). MailKit (.NET) entrega aqui. SÓ na rede interna.
  # DNS revoa.me: MX + SPF + DKIM + DMARC (ver ADR-0014).
  # Serviço base (sem profile): compartilhado por app e app-dev, como mongo/minio.
  # ═══════════════════════════════════════════════════════════
  mail:
    image: mwader/postfix-relay:latest
    container_name: revoa-mail
    environment:
      - POSTFIX_MYDOMAIN=revoa.me
      - POSTFIX_HOSTNAME=mail.revoa.me
      - OPENDKIM_DOMAINS=revoa.me
    volumes:
      - revoa-mail-dkim:/etc/opendkim/keys
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "postfix status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════
  # DEV (dev.revoa.me, profile:dev) — ambiente de homologação ISOLADO
  # ═══════════════════════════════════════════════════════════
  # Contrato do dono: dados de demonstração vivem SEMPRE na instância dev e são
  # populados ANTES de cada release (scripts/seed-dev.py); a instância de
  # produção NUNCA é populada via script (containers distintos = impossível por
  # engano). O app-dev roda em PRODUCTION (endpoints dev 404) lendo o banco dev:
  # o que se valida em dev.revoa.me é exatamente o artefato que sobe p/ produção.

  mongo-dev:
    profiles: ["dev"]
    image: mongo:7
    container_name: revoa-mongo-dev
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - revoa-mongo-dev-data:/data/db
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.hello().isWritablePrimary === true ? quit(0) : quit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  app-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: src/Revoa.Api/Dockerfile
    container_name: revoa-app-dev     # router traefik rt-dev-revoa-me aponta aqui
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:8000
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - Mongo__ConnectionString=mongodb://mongo-dev:27017/?replicaSet=rs0
      - Mongo__Database=revoa_dev
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ROOT_USER:-revoa}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obrigatório (defina em .env)}
      - Chain__RpcUrl=${CHAIN_RPC_URL:-http://anvil:8545}
      - Chain__ChainId=${CHAIN_CHAIN_ID:-31337}
      - Chain__FaucetPrivateKey=${CHAIN_FAUCET_KEY:-}
      - Chain__FundWalletGasOnCreate=true
      - Chain__FundWalletGasEther=1.0
      - Chain__Contracts__RVM=0x5FbDB2315678afecb367f032d93F642f64180aa3
      - Chain__Contracts__Treasury=0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
      - Chain__Contracts__ProductNFT=0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0
      - Chain__Contracts__ServiceVoucher=0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9
      - Chain__Contracts__EscrowVault=0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9
      - Chain__Contracts__CouponRedeemer=0x5FC8d32690cc91D4c39d9d3abcBD16989F875707
      - Admin__Emails=${ADMIN_EMAILS:-}
      # Mesmo relay de e-mail do .env (default = Postfix interno). Com relay configurado
      # o código CHEGA na caixa real. O log abaixo continua como plano B de homologação
      # (self-service do dono) — NUNCA ativar no serviço `app` (artefato de produção).
      - Email__Host=${EMAIL_RELAY_HOST:-mail}
      - Email__Port=${EMAIL_RELAY_PORT:-25}
      - Email__From=${EMAIL_RELAY_FROM:-no-reply@revoa.me}
      - Email__Username=${EMAIL_RELAY_USERNAME:-}
      - Email__Password=${EMAIL_RELAY_PASSWORD:-}
      - Email__ApiKey=${BREVO_API_KEY:-} # setada = API REST do Brevo (chave v3 não autentica SMTP)
      - Email__LogVerificationTokenInDev=true
      - Zenvia__Token=${ZENVIA_TOKEN:-}
      - Jwt__Key=${JWT_KEY:-}
      - Jwt__Audience=revoa
    depends_on:
      mongo-dev: { condition: service_healthy }
      minio: { condition: service_healthy }
      mail: { condition: service_started }
    networks: [internal, traefik_net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ═══════════════════════════════════════════════════════════
  # CHAIN STACK (Fase 1, profile:chain) — TODOS só na rede interna
  # ═══════════════════════════════════════════════════════════

  # ANVIL — nó dev local (fork do padrão Foundry; mesmos endereços do CI).
  # Estado persistente em volume: --dump-state salva no shutdown gracioso
  # (SIGTERM; `exec` torna o anvil PID 1) e --load-state restaura no boot
  # (só quando o arquivo já existe — a flag rejeita path ausente).
  # Endereços determinísticos do Deploy.s.sol são fixados no env do app
  # (Chain__Contracts__*). É o RPC default do app (CHAIN_RPC_URL).
  anvil:
    profiles: ["chain"]
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: revoa-anvil
    # Volume nomeado cria /data como root; a imagem roda como user "foundry" e o
    # --dump-state falha silenciosamente sem permissão de escrita. Root é aceitável
    # aqui: nó dev descartável, só na rede interna.
    user: root
    # ENTRYPOINT da imagem é ["bash","-l","-c"] — engole args avulsos; o comando
    # inteiro precisa vir como UMA string.
    entrypoint: ["bash", "-l", "-c",
                 "exec anvil --host 0.0.0.0 --port 8545 --chain-id 31337 --dump-state /data/state.json $([ -f /data/state.json ] && echo --load-state /data/state.json)"]
    volumes:
      - revoa-anvil-data:/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cast chain-id --rpc-url http://localhost:8545 >/dev/null"]  # imagem foundry não tem curl
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nó Avalanche Subnet-EVM própria (privada agora → pública depois)
  avalanche:
    profiles: ["chain"]
    image: avaplatform/avalanchego:latest
    container_name: revoa-avalanche
    command: ["/avalanchego/build/avalanchego",
              "--network-id=local",
              "--http-host=0.0.0.0",
              "--chain-config-dir=/config"]
    volumes:
      - revoa-chain-data:/root/.avalanchego
      - ./chain:/config:ro
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9650/ext/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Bundler ERC-4337 (Stackup)
  bundler:
    profiles: ["chain"]
    image: stackupstackup/stackup-bundler:latest
    container_name: revoa-bundler
    environment:
      - BUNDLER_RPC=http://0.0.0.0:4337
      - BUNDLER_PRIVATE_NODE_RPC=http://avalanche:9650/ext/bc/RVM/rpc
    networks: [internal]
    depends_on: [avalanche]
    restart: unless-stopped

  # Verifying Paymaster (patrocina gas — usuário só vê RVM)
  paymaster:
    profiles: ["chain"]
    image: shaharyar123/verifying-paymaster:latest
    container_name: revoa-paymaster
    environment:
      - RPC_URL=http://avalanche:9650/ext/bc/RVM/rpc
    networks: [internal]
    depends_on: [avalanche]
    restart: unless-stopped

  # Ollama + Qwen 7B (GPU) — normalização de preços (PricingIntelligence)
  # Requer runtime NVIDIA; em host sem GPU, trocar image por CPU (lento).
  ollama:
    profiles: ["chain"]
    image: ollama/ollama:latest
    container_name: revoa-ollama
    volumes:
      - revoa-ollama-data:/root/.ollama
    networks: [internal]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

# ═══════════════════════════════════════════════════════════════
# Redes
# ═══════════════════════════════════════════════════════════════
networks:
  internal:
    driver: bridge
  traefik_net:
    external: true
    name: traefik_net

# ═══════════════════════════════════════════════════════════════
# Volumes
# ═══════════════════════════════════════════════════════════════
volumes:
  revoa-app-data:
  revoa-mongo-data:
  revoa-mongo-dev-data:
  revoa-minio-data:
  revoa-anvil-data:
  revoa-chain-data:
  revoa-ollama-data:
  revoa-mail-dkim:

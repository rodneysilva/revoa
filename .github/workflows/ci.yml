name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend .NET: build + testes de integração (off-chain, Testcontainers Mongo) ──
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build src/Revoa.sln -c Release --nologo
      - name: Test (off-chain integration + domain)
        # Testcontainers precisa do Docker (disponível no ubuntu-latest). On-chain pulam (sem anvil).
        run: dotnet test src/Revoa.sln -c Release --no-build --filter "FullyQualifiedName~OffChain|FullyQualifiedName~Domain.Tests" --nologo

  # ── Frontend: typecheck + build ──
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Typecheck + Build
        run: npm run build
        working-directory: frontend

  # ── Contratos: forge build + test ──
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install dependencies
        run: |
          git config --global user.email "ci@revoa.me"
          git config --global user.name "revoa CI"
          forge install foundry-rs/forge-std
          forge install OpenZeppelin/openzeppelin-contracts
      - name: Build
        run: forge build
      - name: Test
        run: forge test

  # ── On-chain: integração .NET ↔ anvil + contratos (troca/doação/cupom) ──
  # Endereços são determinísticos: anvil novo + deploy pela account[0] reproduz exatamente
  # os endereços de contracts/deployed-dev.json que appsettings.Development.json espera.
  onchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install dependencies
        working-directory: contracts
        run: |
          git config --global user.email "ci@revoa.me"
          git config --global user.name "revoa CI"
          forge install foundry-rs/forge-std
          forge install OpenZeppelin/openzeppelin-contracts
      - name: Build (.NET)
        run: dotnet build src/Revoa.sln -c Release --nologo
      - name: anvil (chain local em background)
        run: nohup anvil --host 127.0.0.1 --port 8545 > /tmp/anvil.log 2>&1 &
      - name: Aguardar anvil responder
        run: |
          for i in $(seq 1 15); do
            cast block-number --rpc-url http://127.0.0.1:8545 && break
            sleep 1
          done
      - name: Deploy contracts (account[0] do anvil)
        working-directory: contracts
        run: forge script script/Deploy.s.sol --rpc-url http://127.0.0.1:8545 --broadcast --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - name: Test (on-chain integration)
        # Testcontainers Mongo + anvil local. ApiFactory roda em Development (Chain:* da appsettings).
        run: dotnet test src/Revoa.sln -c Release --no-build --filter "FullyQualifiedName~OnChain" --nologo

  # ── E2E Playwright: smoke público com backend real (Mongo service + app .NET) ──
  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Build backend
        run: dotnet build src/Revoa.Api -c Release --nologo
      - name: Backend (background, Development)
        working-directory: src/Revoa.Api
        run: |
          nohup env ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:8000 \
            dotnet bin/Release/net10.0/Revoa.Api.dll > /tmp/backend.log 2>&1 &
      - name: Aguardar /health
        run: curl --retry 30 --retry-delay 2 --retry-connrefused -sf http://127.0.0.1:8000/health
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npm run test:e2e:install
        working-directory: frontend
      - name: Test (Playwright, workers:1)
        run: npm run test:e2e
        working-directory: frontend

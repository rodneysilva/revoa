name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

jobs:
  # ── Backend .NET: build + testes de integração (off-chain, Testcontainers Mongo) ──
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build src/Revoa.sln -c Release --nologo
      - name: Test (off-chain integration)
        # Testcontainers precisa do Docker (disponível no ubuntu-latest). On-chain pulam (sem anvil).
        run: dotnet test src/Revoa.sln -c Release --no-build --filter "FullyQualifiedName~OffChain" --nologo

  # ── Frontend: typecheck + build ──
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Typecheck + Build
        run: npm run build
        working-directory: frontend

  # ── Contratos: forge build + test ──
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        run: forge build --root contracts
      - name: Test
        run: forge test --root contracts
